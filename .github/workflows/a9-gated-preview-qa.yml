name: A9 archived v0.1 preview QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 61a5050165df877fe5cfc97fe16dded4e398f8cd
          persist-credentials: false
      - run: python -m unittest discover -s migration/scripts -p 'test_gated_resource_preview.py' -v
