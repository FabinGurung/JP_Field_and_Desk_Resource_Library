name: A9 Field & Desk — Source-Backed Directory Publisher
on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'docs/releases/v1.3.0.md'
      - 'docs/releases/v1.3.2.md'
      - 'docs/releases/v1.4.0.md'
      - 'docs/governance/**'
      - 'docs/operations/**'
      - 'README.md'
      - '.github/workflows/resource-library-pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'docs/releases/v1.3.0.md'
      - 'docs/releases/v1.3.2.md'
      - 'docs/releases/v1.4.0.md'
      - 'docs/governance/**'
      - 'docs/operations/**'
      - 'README.md'
      - '.github/workflows/resource-library-pages.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the verified build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: a9-field-desk-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check site/app.js
      - run: node --check site/operations.js
      - run: node --check scripts/browser_qa.cjs
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate synthetic public artifact
        run: |
          python scripts/build_browser_fixture.py _preview
          python scripts/validate_public_artifact.py --site _preview

  browser-qa:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Render synthetic, no-credentials browser site
        run: python scripts/build_browser_fixture.py _preview
      - name: Chromium desktop and mobile navigation / links / overflow QA
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory _preview >/tmp/fielddesk-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/catalog.json -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser_qa.cjs

  project:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.test.result == 'success' &&
      (needs['browser-qa'].result == 'success' || (github.event_name == 'schedule' && needs['browser-qa'].result == 'skipped')) &&
      (github.event_name == 'workflow_dispatch' || vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER != '')
    needs: [test, browser-qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check existing Google WIF variables
        env:
          WIF_PROVIDER: ${{ vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Existing Google WIF provider and service-account variables are required."
            exit 1
          fi
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Read authoritative Google Sheet and build reviewed directory
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/publish_library.py --output _site
      - name: Check published counts, origins, URLs, exclusions and access notes
        run: python scripts/validate_public_artifact.py --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    needs: project
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  release-cutover:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify canonical Pages links and publish v1.3.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.3.2.md'
          tag='v1.3.2'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html app.js editing.html operations.html resources/project-documents.html; do
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$pages/$file?release=$GITHUB_SHA" | cmp - "site/$file"
          done
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$pages/catalog.json?release=$GITHUB_SHA" > /tmp/catalog-live.json
          python -c 'import json; j=json.load(open("/tmp/catalog-live.json")); assert j["schema_version"]=="2.0.0" and len(j["companies"])>=1 and j["source_manifest"]["private_payroll_connected"] is False'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library v1.3.2 — Publication Status QA' --notes-file "$notes"
          fi

  release-astam-v1-4:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify Astam Library ownership and tag v1.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.4.0.md'
          tag='v1.4.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo "No new Astam ownership milestone in this push"
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in feasibility/index.html feasibility/buyer-guide/index.html \
            feasibility/buyer-guide/guide.json \
            ops/data/land-feasibility/astam-village-public.v1.0.json \
            ops/data/land-feasibility/astam-buyer-guide-public.v1.0.json \
            assets/css/jp-theme-tokens.css assets/css/site-shell.css \
            assets/css/jp-botanical.css; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" \
              | cmp - "site/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/catalog.json?commit=$GITHUB_SHA" \
            | python -c 'import json,sys; x=json.load(sys.stdin); assert x["schema_version"]=="2.0.0" and x["source_manifest"]["private_payroll_connected"] is False'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library Astam Resources v1.4.0' --notes-file "$notes"
          fi
