name: Resource Library from Google Sheets
on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/releases/v1.0.0.md'
      - 'scripts/publish_library.py'
      - 'scripts/sheets_read.py'
      - 'scripts/test_library_publication.py'
      - '.github/workflows/resource-library-pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/releases/v1.0.0.md'
      - 'scripts/publish_library.py'
      - 'scripts/sheets_read.py'
      - 'scripts/test_library_publication.py'
      - '.github/workflows/resource-library-pages.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the verified build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: library-sheets-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check site/app.js
      - run: python -m unittest discover -s scripts -p 'test_library_publication.py' -v

  project:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER != '')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Google configuration
        env:
          WIF_PROVIDER: ${{ vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Configure the repository's Google Workload Identity provider and service account variables."
            exit 1
          fi
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Read Sheets and build public files
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/publish_library.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: project
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  release-cutover:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and publish the cutover milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.0.0.md'
          tag='v1.0.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$pages/app.js?release=$GITHUB_SHA" | cmp - 'site/app.js'
          refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [ -n "$refs" ]; then
            test "$(printf '%s\n' "$refs" | tail -n 1 | cut -f1)" = "$GITHUB_SHA"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field and Desk Resource Library v1.0.0' --notes-file "$notes"
          fi
